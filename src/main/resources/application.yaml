spring:
  application:
    name: app
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ai_scheduler?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true}
    username: ${DB_USERNAME:ai_scheduler_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  storage:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${S3_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    presigned-url-minutes: ${S3_PRESIGNED_URL_MINUTES:10}
