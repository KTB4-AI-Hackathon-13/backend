spring:
  application:
    name: app

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:ai_hackathon}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: ${DB_USERNAME:hackathon}
    password: ${DB_PASSWORD:hackathon}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: Asia/Seoul

app:
  cors:
    # 프론트 개발 서버 origin (쉼표 구분). 배포 시 환경변수 APP_CORS_ALLOWED_ORIGINS 로 덮어쓰기
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
