spring:
  application:
    name: app
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ai_scheduler?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true}
    username: ${DB_USERNAME:ai_scheduler_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    # OffsetDateTime 직렬화 기준 시간대 (응답 일시 +09:00)
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  ai:
    # BE가 외부 AI 서버에 동기 요청할 때 사용하는 주소와 타임아웃
    base-url: ${AI_BASE_URL:}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:60}
  cors:
    # 프론트 개발 서버 origin (쉼표 구분). 배포 시 환경변수 APP_CORS_ALLOWED_ORIGINS 로 덮어쓰기
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  auth:
    # true 면 세션 쿠키가 없을 때 X-User-Id 헤더로 사용자를 식별 (로컬 Postman 테스트용). 운영에서는 반드시 false
    dev-header-enabled: ${APP_AUTH_DEV_HEADER_ENABLED:false}
  storage:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${S3_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    presigned-url-minutes: ${S3_PRESIGNED_URL_MINUTES:10}
